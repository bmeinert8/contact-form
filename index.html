<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor Contact Form</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="main-container">
      <h1 class="heading-text">Contact Us</h1>
      <form novalidate>
        <!-- Disable browser built-in form validation -->
        <fieldset class="name-input">
          <legend></legend>
          <!-- Container for first name, input, and error message -->
          <div class="name-container">
            <label for="first-name" class="body-sm">
              First Name
              <span class="asterisk">*</span>
            </label>
            <input type="text" id="first-name" name="first-name" required />
            <p id="first-name-error-message" class="hidden-error">
              This field is required
            </p>
          </div>
          <!-- Container for last name, input, and error message -->
          <div class="name-container">
            <label for="last-name" class="body-sm">
              Last Name
              <span class="asterisk">*</span>
            </label>
            <input type="text" id="last-name" name="last-name" required />
            <p id="last-name-error-message" class="hidden-error">
              This field is required
            </p>
          </div>
        </fieldset>
        <!-- Container for emai, input, and error message -->
        <div class="email-container">
          <label for="email" class="body-sm">
            Email Address
            <span class="asterisk">*</span>
          </label>
          <input type="email" id="email" name="email" required />
          <p id="email-error-message" class="hidden-error">
            Please enter a valid email address
          </p>
        </div>
        <fieldset class="radio-input">
          <legend class="body-sm legend">
            Query Type
            <span class="asterisk">*</span>
          </legend>
          <div class="radio-option">
            <input
              type="radio"
              id="general-enqury"
              name="query-type"
              class="radio-button"
            />
            <label for="general-enqury" class="body-md-regular"
              >General Enquery
            </label>
          </div>
          <div class="radio-option">
            <input
              type="radio"
              id="support-request"
              name="query-type"
              class="radio-button"
            />
            <label for="support-request" class="body-md-regular">
              Support Request
            </label>
          </div>
          <p id="query-type-error-message" class="hidden-error">
            Please select a query type
          </p>
        </fieldset>
        
      </form>
    </main>
    <script src="index.js" defer></script>
  </body>
</html>
